<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="800" height="300" rx="16" fill="url(#bg)"/>
  
  <!-- Abstract graphic representing temperature distribution curves -->
  <g opacity="0.25">
    <!-- Uncalibrated/Cold distribution (sharp peaks) -->
    <path d="M 100 250 Q 200 250 250 80 T 300 250 Q 400 250 500 250" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="5 5"/>
    <!-- Calibrated/Optimal distribution -->
    <path d="M 100 250 Q 220 250 280 140 T 360 250 Q 480 250 600 250" fill="none" stroke="#a855f7" stroke-width="4" />
    <!-- High temp / Hot distribution (flat curve) -->
    <path d="M 100 250 Q 300 220 400 200 T 700 250" fill="none" stroke="#ec4899" stroke-width="2" />
  </g>

  <!-- Glowing background elements -->
  <circle cx="680" cy="80" r="60" fill="#ec4899" opacity="0.15" filter="url(#blur-glow)"/>
  <circle cx="150" cy="220" r="85" fill="#3b82f6" opacity="0.1" filter="url(#blur-glow)"/>

  <!-- Title Text -->
  <g filter="url(#shadow)">
    <text x="50%" y="130" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#glow)" letter-spacing="2">
      AWESOME TEMPERATURE SCALING
    </text>
    <text x="50%" y="175" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="4">
      EVOLUTION • VARIANTS • TYPES • APPLICATIONS
    </text>
  </g>

  <!-- Graphic Nodes -->
  <g transform="translate(400, 220)">
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#475569" stroke-width="2" opacity="0.5"/>
    <circle cx="-120" cy="0" r="6" fill="#3b82f6"/>
    <text x="-120" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Logits (z)</text>
    
    <circle cx="0" cy="0" r="12" fill="#a855f7"/>
    <text x="0" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#cbd5e1">1/T Scaling</text>
    
    <circle cx="120" cy="0" r="6" fill="#ec4899"/>
    <text x="120" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">Softmax (p)</text>
  </g>
</svg>
